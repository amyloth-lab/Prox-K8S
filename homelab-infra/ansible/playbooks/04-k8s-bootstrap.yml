---
- name: Initialize the primary Kubernetes control plane
  hosts: "{{ primary_control_plane }}"
  become: true

  tasks:
    - name: Render kubeadm InitConfiguration and ClusterConfiguration
      ansible.builtin.template:
        src: ../templates/kubeadm-config.yaml.j2
        dest: /root/kubeadm-config.yaml
        mode: "0600"

    - name: Run kubeadm init on primary control plane
      ansible.builtin.command:
        cmd: kubeadm init --config /root/kubeadm-config.yaml --upload-certs
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin.conf to ubuntu user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Re-upload control plane certificates and capture certificate key
      ansible.builtin.shell: |
        kubeadm init phase upload-certs --upload-certs | tail -n 1
      register: kubeadm_cert_key
      changed_when: false

    - name: Generate fresh worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_worker_join
      changed_when: false

    - name: Store join commands as facts on primary control plane
      ansible.builtin.set_fact:
        worker_join_cmd: "{{ kubeadm_worker_join.stdout }}"
        cp_join_cmd: "{{ kubeadm_worker_join.stdout }} --control-plane --certificate-key {{ kubeadm_cert_key.stdout }}"

- name: Join secondary control plane nodes
  hosts: control_plane:!k8s-cp-01
  become: true
  serial: 1

  tasks:
    - name: Join secondary control plane node to HA cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[primary_control_plane]['cp_join_cmd'] }} --apiserver-advertise-address={{ ansible_host }}"
        creates: /etc/kubernetes/kubelet.conf

    - name: Create .kube directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin.conf to ubuntu user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

- name: Join Kubernetes Worker Nodes (k8s-wk-01 to k8s-wk-03)
  hosts: workers
  become: true

  tasks:
    - name: Join worker node to cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[primary_control_plane]['worker_join_cmd'] }}"
        creates: /etc/kubernetes/kubelet.conf

- name: Label Worker Nodes with worker Role
  hosts: "{{ primary_control_plane }}"
  become: false

  tasks:
    - name: Apply node-role.kubernetes.io/worker label to all workers
      ansible.builtin.command:
        cmd: "kubectl label node {{ item }} node-role.kubernetes.io/worker=worker --overwrite"
      loop: "{{ groups['workers'] }}"
      changed_when: true
