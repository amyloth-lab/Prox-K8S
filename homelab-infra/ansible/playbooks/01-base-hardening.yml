---
- name: Base OS Hardening & Time Synchronization (All Nodes)
  hosts: all
  become: true

  tasks:
    - name: Set system timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Update apt cache and install baseline utilities
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - curl
          - gnupg
          - ca-certificates
          - apt-transport-https
          - software-properties-common
          - chrony
          - jq
          - htop
          - net-tools
          - qemu-guest-agent
        state: present

    - name: Ensure chrony NTP service is enabled and running
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

    - name: Harden SSH daemon (disable password authentication and root login)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: "/usr/sbin/sshd -t -f %s"
      loop:
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted
