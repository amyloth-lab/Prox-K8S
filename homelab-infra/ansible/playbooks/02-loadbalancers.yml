---
- name: Configure HAProxy & Keepalived High-Availability API Load Balancers
  hosts: loadbalancers
  become: true

  tasks:
    - name: Allow binding to non-local virtual IP addresses
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        sysctl_file: /etc/sysctl.d/99-keepalived-vip.conf
        state: present
        reload: true

    - name: Install HAProxy, Keepalived, and psmisc
      ansible.builtin.apt:
        name:
          - haproxy
          - keepalived
          - psmisc
        state: present
        update_cache: true

    - name: Deploy Keepalived configuration
      ansible.builtin.template:
        src: ../templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart keepalived

    - name: Deploy HAProxy configuration
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/haproxy -c -f %s"
      notify: Restart haproxy

    - name: Ensure HAProxy and Keepalived are enabled and running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - haproxy
        - keepalived

  handlers:
    - name: Restart keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

    - name: Restart haproxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
