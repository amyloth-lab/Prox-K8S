---
- name: Configure Kubernetes Node Prerequisites & Containerd
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Permanently disable swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Persist required kernel modules (overlay, br_netfilter)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay and br_netfilter kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl parameters for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: Reload sysctl

    - name: Install containerd runtime
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    - name: Ensure /etc/containerd directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd config.toml
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Ensure containerd service is enabled and running
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download and dearmor Kubernetes official GPG signing key
      ansible.builtin.shell: |
        curl -fsSL "https://pkgs.k8s.io/core:/stable:/{{ k8s_version_minor }}/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Set permissions on Kubernetes GPG keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: "0644"

    - name: Add Kubernetes official APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubelet, kubeadm, and kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ k8s_package_version }}"
          - "kubeadm={{ k8s_package_version }}"
          - "kubectl={{ k8s_package_version }}"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages to prevent unintended upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service (will wait for kubeadm init/join)
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: Prepare Worker Nodes for Longhorn Distributed Storage
  hosts: workers
  become: true

  tasks:
    - name: Install Longhorn OS dependencies (open-iscsi, nfs-common)
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
          - util-linux
        state: present

    - name: Enable and start iscsid service
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    - name: Format secondary disk with ext4 filesystem
      community.general.filesystem:
        fstype: ext4
        dev: "{{ longhorn_disk_device }}"

    - name: Mount the Longhorn disk and persist it in /etc/fstab
      ansible.posix.mount:
        path: "{{ longhorn_mount_path }}"
        src: "{{ longhorn_disk_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted
